    versionCode: 5
    commit: v0.3.0
    subdir: android
    srclibs:
      - VeraCryptPort@v0.3.0
    prebuild:
      - ln -sfn $$VeraCryptPort$$ ../veracrypt
    gradle:
      - fdroid
    ndk: r26d
