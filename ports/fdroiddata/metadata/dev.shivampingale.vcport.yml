Name: VC Port
AutoName: VC Port
Summary: Open VeraCrypt volumes offline with biometrics, share, and file wrap
Description: |-
    VC Port opens VeraCrypt-compatible encrypted containers on Android. It is a
    derived work and is not named VeraCrypt.

    Contact: Shivam Mangesh Pingale, shivampingaledev@proton.me,
    shivampingaledev@gmail.com.

    The F-Droid flavor has no INTERNET permission, no ads, no analytics, and no
    crash reporters. Volume passwords stay on the device.

    Portions of this product are based in part on TrueCrypt, freely available at
    http://www.truecrypt.org/

    Original VC Port code is Apache-2.0. The native volume core is VeraCrypt,
    which is dual-licensed Apache-2.0 AND TrueCrypt License 3.0. TrueCrypt
    License 3.0 is not OSI-listed. Reviewers should treat the inherited
    TrueCrypt files under that dual-license statement.

    Builds from the public Veracrypt_port tree (subdir ports/android). The
    VeraCrypt src/ directory is in the same git commit; no extra srclib is
    required. The mobile-only VCPort mirror is not the F-Droid source.

