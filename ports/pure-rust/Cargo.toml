# Educational scratch Rust — experimental-pure-rust branch.
# Default build: hand-written modules only (+ clap for CLI).
# Optional features pull crates so you can *compare* against your code.

[package]
name = "vcport-pure-rust"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "VC Port educational Rust lab (hand-written, not a product)"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"

# Optional — enable with --features compare-crates
sha2 = { version = "0.10", optional = true }
aes = { version = "0.8", optional = true }
hex = { version = "0.4", optional = true }

[features]
default = []
compare-crates = ["sha2", "aes", "hex"]

[dev-dependencies]
tempfile = "3.14"
