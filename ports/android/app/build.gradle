plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.shivampingale.vcport'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'dev.shivampingale.vcport'
        minSdk 28
        targetSdk 35
        versionCode 4
        versionName '0.2.2'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-28'
            }
        }
    }

    flavorDimensions += 'distribution'
    productFlavors {
        fdroid {
            dimension 'distribution'
            buildConfigField 'boolean', 'ENABLE_UPDATE_CHECK', 'false'
        }
        github {
            dimension 'distribution'
            buildConfigField 'boolean', 'ENABLE_UPDATE_CHECK', 'true'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // CI / GitHub preview: debug-signed until a release keystore is set.
            // F-Droid rebuilds from source and signs with the F-Droid key.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    externalNativeBuild {
        cmake {
            path file('../../shared/CMakeLists.txt')
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    lint {
        abortOnError false
        disable 'GoogleAppIndexingWarning', 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
