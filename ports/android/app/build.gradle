plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versionJsonFile = file("${project.projectDir}/../../version.json")
def versionJson = new groovy.json.JsonSlurper().parse(versionJsonFile)
def qcfg = { String s -> s.replace('\\', '\\\\').replace('"', '\\"') }

android {
    namespace 'dev.shivampingale.vcport'
    compileSdk 35
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'dev.shivampingale.vcport'
        minSdk 28
        targetSdk 35
        versionCode (versionJson.android_version_code as Integer)
        versionName versionJson.port_version
        buildConfigField 'String', 'PORT_VERSION', "\"${qcfg(versionJson.port_version as String)}\""
        buildConfigField 'String', 'UPSTREAM_VERSION', "\"${qcfg(versionJson.upstream_version as String)}\""
        buildConfigField 'String', 'UPSTREAM_COMMIT', "\"${qcfg(versionJson.upstream_commit as String)}\""
        buildConfigField 'String', 'SOURCE_REPO', "\"${qcfg(versionJson.source_repo as String)}\""
        buildConfigField 'String', 'SOURCE_MANIFEST', "\"${qcfg(versionJson.update_manifest as String)}\""
        // Official VeraCrypt git + GitHub latest-release API, baked in at compile time.
        // Master APKs never fetch these URLs. Live Check for updates is on experimental-biometrics.
        buildConfigField 'String', 'UPSTREAM_GIT', "\"${qcfg(versionJson.upstream_git as String)}\""
        buildConfigField 'String', 'UPSTREAM_RELEASES', "\"${qcfg(versionJson.upstream_releases as String)}\""
        buildConfigField 'String', 'UPSTREAM_TAG', "\"${qcfg(versionJson.upstream_tag as String)}\""
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', '-DANDROID_PLATFORM=android-28'
            }
        }
    }

    flavorDimensions += 'distribution'
    productFlavors {
        foss {
            dimension 'distribution'
            buildConfigField 'boolean', 'ENABLE_UPDATE_CHECK', 'false'
        }
        github {
            dimension 'distribution'
            buildConfigField 'boolean', 'ENABLE_UPDATE_CHECK', 'false'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // CI / GitHub preview: debug-signed until a release keystore is set.
            // Sign production yourself with VC_PORT_RELEASE_STORE_FILE.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    externalNativeBuild {
        cmake {
            path file('../../shared/CMakeLists.txt')
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    lint {
        abortOnError true
        disable 'GoogleAppIndexingWarning', 'ExpiredTargetSdkVersion'
    }
    testOptions {
        animationsDisabled true
    }
}

def releaseStore = System.getenv('VC_PORT_RELEASE_STORE_FILE')
if (releaseStore) {
    android.signingConfigs {
        create('release') {
            storeFile file(releaseStore)
            storePassword System.getenv('VC_PORT_RELEASE_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('VC_PORT_RELEASE_KEY_ALIAS') ?: ''
            keyPassword System.getenv('VC_PORT_RELEASE_KEY_PASSWORD') ?: ''
        }
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.release
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.06.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
