name: VC Port

on:
  push:
    branches: [master, experimental-otg-master, test_before]
    paths:
      - 'ports/**'
      - 'src/Crypto/**'
      - 'src/Volume/**'
      - 'src/Platform/**'
      - 'src/Common/**'
      - 'src/Main/**'
      - 'src/Driver/**'
      - 'scripts/**'
      - 'SECURITY.md'
      - 'README.md'
      - 'SUPPORT.md'
      - '.github/workflows/vcport.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [master]
    paths:
      - 'ports/**'
      - 'src/Crypto/**'
      - 'src/Volume/**'
      - 'src/Platform/**'
      - 'src/Common/**'
      - 'src/Main/**'
      - 'src/Driver/**'
      - 'scripts/**'
      - 'SECURITY.md'
      - 'README.md'
      - 'SUPPORT.md'
      - '.github/workflows/vcport.yml'

concurrency:
  group: vcport-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Phone builds do not wait on a separate host-contract job.
  # Each phone job runs its own small Python check, then builds.
  # The full host suite stays local. The phone UI walk stays on a local Mac.
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"
      - name: Host contracts again on the Android runner
        run: |
          cd ports/tests
          python3 run_verbose.py test_phases.Phase8CiTests test_quality.PimAndSessionContractTests -v
      - name: Build production and debug APKs
        working-directory: ports/android
        run: ./gradlew :app:assembleFossRelease :app:assembleFossDebug :app:assembleGithubRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vcport-production-apk
          path: ports/android/app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vcport-debug-apk
          path: ports/android/app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vcport-github-apk
          path: ports/android/app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error

  # Parallel with android (no needs:). Unsigned IPA only — GitHub has no Apple cert.
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and CMake
        run: brew install xcodegen cmake
      - name: Host contracts on the iOS runner
        run: |
          cd ports/tests
          python3 run_verbose.py test_phases.Phase5IosTests test_quality.PimAndSessionContractTests -v
      - name: Build unsigned iPhone IPA
        run: ports/ios/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vcport-ipa
          path: ports/ios/build/VCPort-*-unsigned-preview.ipa
          if-no-files-found: error

  # No GitHub Release APK attach from this workflow. Production and debug APKs
  # are separate artifacts. Both are debug-signed until a release keystore is set.
  # TrueCrypt 3.0 still requires public source if a binary is ever shipped.
