name: VC Port

on:
  push:
    branches: [master, experimental-otg-master, test_before]
    paths:
      - 'ports/**'
      - 'src/Crypto/**'
      - 'src/Volume/**'
      - 'src/Platform/**'
      - 'src/Common/**'
      - 'src/Main/**'
      - 'src/Driver/**'
      - 'scripts/**'
      - 'SECURITY.md'
      - 'README.md'
      - 'SUPPORT.md'
      - '.github/workflows/vcport.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [master]
    paths:
      - 'ports/**'
      - 'src/Crypto/**'
      - 'src/Volume/**'
      - 'src/Platform/**'
      - 'src/Common/**'
      - 'src/Main/**'
      - 'src/Driver/**'
      - 'scripts/**'
      - 'SECURITY.md'
      - 'README.md'
      - 'SUPPORT.md'
      - '.github/workflows/vcport.yml'

concurrency:
  group: vcport-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # wrap-test and host-macos always failed (wrap C++ / full run-all on GHA).
  # Host Python contracts include the agile regressive/progressive gate.
  # Phone UI walks are ui-walk-android and ui-walk-ios, parallel with the APK/IPA jobs.
  host-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch tags for version check
        run: git fetch origin "+refs/tags/*:refs/tags/*"
      - name: Python host contracts (no wrap, no emulator)
        run: |
          cd ports/tests
          python3 -m unittest test_phases test_contracts test_factors test_wipe test_quality test_agile -v

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"
      - name: Host contracts again on the Android runner
        run: |
          cd ports/tests
          python3 -m unittest test_phases.Phase8CiTests test_quality.PimAndSessionContractTests -v
      - name: Build production APKs
        working-directory: ports/android
        run: ./gradlew :app:assembleFossRelease :app:assembleGithubRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vcport-apks
          path: |
            ports/android/app/build/outputs/apk/foss/release/*.apk
            ports/android/app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error

  # Parallel with android (no needs:). Unsigned IPA only — GitHub has no Apple cert.
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and CMake
        run: brew install xcodegen cmake
      - name: Host contracts on the iOS runner
        run: |
          cd ports/tests
          python3 -m unittest test_phases.Phase5IosTests test_quality.PimAndSessionContractTests -v
      - name: Build unsigned iPhone IPA
        run: ports/ios/build-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vcport-ipa
          path: ports/ios/build/VCPort-*-unsigned-preview.ipa
          if-no-files-found: error

  # Same UI walk as ports/scripts/run-ui-walk.sh. No needs: so this stays
  # parallel with the APK job. Headless AVD. Does not tap Panic or Check for updates.
  ui-walk-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35 emulator image
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKM"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKM" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1" \
            "system-images;android-35;google_apis;x86_64"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Android UI walk (regressive session + progressive USB and preview)
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          export VC_PORT_CI=1
          export VC_PORT_WALK=android
          export VC_PORT_CREATE_AVD=1
          export VC_PORT_AVD_RAM=2048
          ports/scripts/run-ui-walk.sh

  # Parallel with ui-walk-android and the IPA job. Missing Simulator fails the job.
  ui-walk-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and CMake
        run: brew install xcodegen cmake
      - name: iOS UI walk (regressive session + no whole-disk USB + preview)
        run: |
          export VC_PORT_CI=1
          export VC_PORT_WALK=ios
          export DEVELOPER_DIR="${DEVELOPER_DIR:-/Applications/Xcode.app/Contents/Developer}"
          ports/scripts/run-ui-walk.sh

  # No GitHub Release APK attach. CI APKs are debug-signed previews.
  # TrueCrypt 3.0 still requires public source if a binary is ever shipped.
