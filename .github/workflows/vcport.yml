name: VC Port

on:
  push:
    branches: [master]
    paths:
      - 'ports/**'
      - 'src/Crypto/**'
      - 'src/Volume/**'
      - 'src/Platform/**'
      - 'src/Common/**'
      - 'src/Main/PortVersion.h'
      - 'src/Main/UserPreferences.h'
      - 'src/Driver/Fuse/FuseService.cpp'
      - 'scripts/**'
      - '.github/workflows/vcport.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [master]
    paths:
      - 'ports/**'
      - 'src/Crypto/**'
      - 'src/Volume/**'
      - 'src/Platform/**'
      - 'src/Common/**'
      - 'src/Main/PortVersion.h'
      - 'src/Main/UserPreferences.h'
      - 'src/Driver/Fuse/FuseService.cpp'
      - 'scripts/**'
      - '.github/workflows/vcport.yml'

concurrency:
  group: vcport-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wrap-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++ python3 cmake
      - name: Host tests (wrap, volumes, versions, FOSS, overlay)
        run: ports/tests/run-all.sh

  host-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Host tests (no FUSE-T)
        run: ports/tests/run-all.sh

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build F-Droid and GitHub APKs
        working-directory: ports/android
        run: ./gradlew :app:assembleFdroidRelease :app:assembleGithubRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vcport-apks
          path: ports/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  # No GitHub Release APK attach while the tree is private (TrueCrypt 3.0).
  # After a public relaunch, artifacts may be attached only if they are clearly
  # labeled debug-signed previews.
