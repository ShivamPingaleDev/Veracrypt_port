name: VC Port

on:
  push:
    branches: [master]
    paths:
      - 'ports/**'
      - 'src/Crypto/**'
      - 'src/Volume/**'
      - 'src/Platform/**'
      - 'src/Common/**'
      - '.github/workflows/vcport.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [master]
    paths:
      - 'ports/**'
      - 'src/Crypto/**'
      - 'src/Volume/**'
      - 'src/Platform/**'
      - 'src/Common/**'
      - '.github/workflows/vcport.yml'

concurrency:
  group: vcport-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wrap-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Wrap host test
        run: ports/shared/run_wrap_test.sh

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build F-Droid and GitHub APKs
        working-directory: ports/android
        run: ./gradlew :app:assembleFdroidRelease :app:assembleGithubRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vcport-apks
          path: ports/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release-apks:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wrap-test, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vcport-apks
          path: apks
      - uses: softprops/action-gh-release@v2
        with:
          files: apks/**/*.apk
          fail_on_unmatched_files: false
