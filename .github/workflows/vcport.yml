name: VC Port

on:
  push:
    branches: [master]
    paths:
      - 'ports/**'
      - 'src/Crypto/**'
      - 'src/Volume/**'
      - 'src/Platform/**'
      - 'src/Common/**'
      - 'src/Main/**'
      - 'src/Driver/**'
      - 'scripts/**'
      - 'SECURITY.md'
      - '.github/workflows/vcport.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [master]
    paths:
      - 'ports/**'
      - 'src/Crypto/**'
      - 'src/Volume/**'
      - 'src/Platform/**'
      - 'src/Common/**'
      - 'src/Main/**'
      - 'src/Driver/**'
      - 'scripts/**'
      - 'SECURITY.md'
      - '.github/workflows/vcport.yml'

concurrency:
  group: vcport-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wrap-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++ python3 cmake
      - name: Host tests (wrap, volumes, versions, FOSS, overlay)
        run: ports/tests/run-all.sh

  host-macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Host tests (no FUSE-T)
        run: ports/tests/run-all.sh

  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build production and Looks APKs
        working-directory: ports/android
        run: ./gradlew :app:assembleFossRelease :app:assembleGithubRelease :app:assembleStyledRelease :app:assembleLooksgithubRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vcport-apks
          path: |
            ports/android/app/build/outputs/apk/foss/release/*.apk
            ports/android/app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: vcport-looks-apk
          path: |
            ports/android/app/build/outputs/apk/styled/release/*.apk
            ports/android/app/build/outputs/apk/looksgithub/release/*.apk
          if-no-files-found: error

  ios-native:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: iOS simulator native lib (no IPA, no signing)
        run: IOS_SDK=iphonesimulator IOS_ARCH=$(uname -m) ports/ios/build-native.sh

  # No GitHub Release APK attach. CI APKs are debug-signed previews.
  # TrueCrypt 3.0 still requires public source if a binary is ever shipped.
